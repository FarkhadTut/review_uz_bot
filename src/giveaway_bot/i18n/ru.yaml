rules: |
  🎁 <b>Еженедельный розыгрыш</b>
  ━━━━━━━━━━━━━━
  Каждую неделю один победитель получает годовую подписку на <b>Review.uz</b> бесплатно.

  🏆 <b>Приз:</b> платная подписка на 12 месяцев
  💰 <b>Стоимость:</b> 650 000 сумов

  <b>Как участвовать?</b>
  1️⃣ Подпишитесь на канал <a href="{channel_url}">@reviewuznews</a>
  2️⃣ Всё! Бот запишет вас в розыгрыш автоматически
  3️⃣ Оставайтесь подписчиком до объявления итогов

  ♾ Участвуете один раз — и попадаете во все следующие еженедельные розыгрыши.
  🔐 Победитель определяется открытым проверяемым случайным выбором.
  🆓 Участие бесплатное. Каждый участник может выиграть только один раз.

