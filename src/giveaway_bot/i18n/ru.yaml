verify_none: "Розыгрышей пока не было."
verify_unknown: "Розыгрыш с таким номером не найден."
verify_text: |

  1. В приложенном файле — коды участников в алфавитном порядке, по одному на строку. Найдите свой код (/status).
  2. SHA-256(содержимое файла) должен быть равен <code>{snapshot_hash}</code> (без перевода строки в конце).
  3. Раунд drand {round}: https://api.drand.sh/{chain}/public/{round}
  4. Индекс = int.from_bytes(SHA256(bytes.fromhex(randomness) + bytes.fromhex(hash)), 'big') mod {n} = {index}; отсчёт с 0. Если есть пропуски — следующий индекс, (i+1) mod {n}.
  {result_line}
  Готовый скрипт: tools/verify_draw.py
verify_pending: "Случайное значение ещё не опубликовано — победитель не определён."
