rules: |
  🎁 <b>Каждую неделю одному победителю — годовая подписка на Review.uz бесплатно!</b>

  🏆 Приз — годовая подписка стоимостью 650 000 сумов: 12 месяцев бесплатного доступа к платным статьям и аналитике review.uz.

  <b>Чтобы участвовать:</b>
  1. Подпишитесь на канал <a href="{channel_url}">@reviewuznews</a>.
  2. Нажмите кнопку «Участвовать» ниже.
  3. Оставайтесь подписчиком канала до объявления результатов.

  Достаточно нажать один раз — вы участвуете во всех следующих еженедельных розыгрышах. Каждый участник может выиграть только один раз.
  Победитель определяется открытым и проверяемым случайным выбором (/verify). Участие бесплатное.

