verify_text: |
  🔎 <b>Танлов №{draw_no}ни текшириш</b>

  1. Илова қилинган файлда иштирок кодлари алфавит тартибида, ҳар бири алоҳида қаторда. Ўз кодингизни (/status) ундан топишингиз мумкин.
  2. SHA-256(файл мазмуни) = <code>{snapshot_hash}</code> бўлиши керак (охирида янги қатор белгисиз).
  3. drand раунди {round}: https://api.drand.sh/{chain}/public/{round}
  4. Индекс = int(SHA256(randomness_bytes ‖ hash_bytes)) mod {n} = {index}; 0 дан бошлаб саналади.
  {result_line}
  Тайёр скрипт: tools/verify_draw.py
