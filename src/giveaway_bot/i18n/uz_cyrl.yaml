  1. <a href="{channel_url}">@reviewuznews</a> каналига обуна бўлинг.
  2. Пастдаги «Иштирок этиш» тугмасини босинг.
  3. Натижалар эълон қилингунга қадар каналга обунани сақланг.

  Бир марта иштирок этсангиз — кейинги барча ҳафталик танловларда қатнашасиз. Ҳар бир иштирокчи фақат бир марта ғолиб бўлиши мумкин.
  Ғолиб очиқ ва текширса бўладиган тасодифий танлов асосида аниқланади (/verify). Иштирок этиш бепул.

