verify_unknown: "Bunday raqamli tanlov topilmadi."
verify_text: |
  🔎 <b>Tanlov №{draw_no}ni tekshirish</b>

  1. Ilova qilingan faylda ishtirok kodlari alifbo tartibida, har biri alohida qatorda. O‘z kodingizni (/status) undan topishingiz mumkin.
  2. SHA-256(fayl mazmuni) = <code>{snapshot_hash}</code> bo‘lishi kerak (oxirida yangi qator belgisiz).
  3. drand raundi {round}: https://api.drand.sh/{chain}/public/{round}
  4. Indeks = int.from_bytes(SHA256(bytes.fromhex(randomness) + bytes.fromhex(hash)), 'big') mod {n} = {index}; 0 dan boshlab sanaladi. O‘tkazib yuborilganlar bo‘lsa — keyingi indeks, (i+1) mod {n}.
  {result_line}
  Tayyor skript: tools/verify_draw.py
