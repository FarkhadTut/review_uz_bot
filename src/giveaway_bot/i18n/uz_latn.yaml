rules: |
  🎁 <b>Har hafta bir g‘olibga — Review.uz saytiga bir yillik bepul obuna!</b>

  🏆 Sovrin — qiymati 650 000 so‘m bo‘lgan bir yillik obuna: review.uz saytining pullik maqola va tahlillarini 12 oy davomida bepul o‘qish imkoniyati.

  <b>Ishtirok etish uchun:</b>
  1. <a href="{channel_url}">@reviewuznews</a> kanaliga obuna bo‘ling.
  2. Pastdagi «Ishtirok etish» tugmasini bosing.
  3. Natijalar e’lon qilinguncha kanalga obunani saqlang.

  Bir marta ishtirok etsangiz — keyingi barcha haftalik tanlovlarda qatnashasiz. Har bir ishtirokchi faqat bir marta g‘olib bo‘lishi mumkin.
  G‘olib ochiq va tekshirsa bo‘ladigan tasodifiy tanlov asosida aniqlanadi (/verify). Ishtirok etish bepul.

