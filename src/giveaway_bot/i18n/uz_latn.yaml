rules: |
  🎁 <b>Haftalik tanlov</b>
  ━━━━━━━━━━━━━━
  Har hafta bir g‘olib <b>Review.uz</b> saytiga bir yillik bepul obunani yutib oladi.

  🏆 <b>Sovrin:</b> 12 oylik pullik obuna
  💰 <b>Qiymati:</b> 650 000 so‘m

  <b>Qanday ishtirok etiladi?</b>
  1️⃣ <a href="{channel_url}">@reviewuznews</a> kanaliga obuna bo‘ling
  2️⃣ «✅ Ishtirok etish» tugmasini bosing
  3️⃣ Natijalar e’lon qilinguncha obunani saqlang

  ♾ Bir marta ishtirok etsangiz — keyingi barcha haftalik tanlovlarda qatnashasiz.
  🔐 G‘olib ochiq va tekshirsa bo‘ladigan tasodifiy tanlov bilan aniqlanadi.
  🆓 Ishtirok etish bepul. Har bir ishtirokchi faqat bir marta yutishi mumkin.

